events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    # BRIDGE accepts source files up to 50 MiB plus multipart overhead.
    client_max_body_size 51m;

    # Empty keys are not counted, so CORS preflight does not consume the
    # POST budgets. Use the connection IP; do not trust client X-Forwarded-For.
    map $request_method $bridge_session_post_key {
        default "";
        POST $binary_remote_addr;
    }
    map $request_method $bridge_tutor_post_key {
        default "";
        POST $binary_remote_addr;
    }
    map $request_method $bridge_tutor_connection_key {
        default "";
        POST bridge-tutor;
    }
    map $request_method $sms_post_key {
        default "";
        POST $binary_remote_addr;
    }

    # Per-IP budgets allow a class to arrive behind one campus NAT. Tune the
    # tutor budget against measured model throughput before opening to traffic.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $bridge_session_post_key zone=bridge_session_limit:10m rate=10r/s;
    limit_req_zone $bridge_tutor_post_key zone=bridge_tutor_limit:10m rate=10r/s;
    limit_req_zone $sms_post_key zone=sms_limit:10m rate=5r/m;
    limit_req_status 429;
    # One shared key caps in-flight tutor POSTs across all IPs and backend
    # workers behind this nginx instance; OPTIONS has an empty key. Tune 8
    # against the measured model queue and adjust each nginx replica likewise.
    limit_conn_zone $bridge_tutor_connection_key zone=bridge_tutor_concurrency:10m;
    limit_conn_status 429;
    server {
        listen 80;
        server_name teach-bridge.com www.teach-bridge.com;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        } 
    }
    server {
        listen 443 ssl;

        server_name teach-bridge.com www.teach-bridge.com;

        ssl_certificate /etc/letsencrypt/live/teach-bridge.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/teach-bridge.com/privkey.pem;
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }
        # API proxy with rate limiting
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # WebSocket proxy
        location /ws/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        # Apply tighter limits to the public BRIDGE routes.
        location = /api/bridge/sessions {
            limit_req zone=bridge_session_limit burst=100 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        location = /api/bridge/tutor {
            limit_req zone=bridge_tutor_limit burst=50 nodelay;
            limit_conn bridge_tutor_concurrency 8;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # The backend also applies an atomic, per-phone Redis cooldown.
        location = /api/auth/send-sms {
            limit_req zone=sms_limit burst=5 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        location = /api/auth/registration-code {
            limit_req zone=sms_limit burst=2 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static files
        location /static/ {
            alias /usr/share/nginx/html/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # PWA & SPA fallback
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";
    }
}
